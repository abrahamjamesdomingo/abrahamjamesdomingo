<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="16" viewBox="0 0 1200 16" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#818cf8" stop-opacity="1"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.7;0.3;-0.7" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.3;1.3;0.3" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="16" fill="url(#edgeFade)"/></mask>
    <filter id="dglow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <g mask="url(#fadeMask)">
    <rect y="7" width="1200" height="1.5" fill="#334155" opacity="0.55"/>
    <rect y="6.5" width="1200" height="3" rx="1.5" fill="url(#beam)"/>
    <rect y="5" width="1200" height="6" rx="3" fill="url(#beam)" opacity="0.4" filter="url(#dglow)"/>
    <circle cx="0" cy="8" r="2.5" fill="#67e8f9">
      <animateMotion dur="8s" repeatCount="indefinite" path="M0,8 H1200"/>
      <animate attributeName="opacity" values="0;1;0.9;0" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
