<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Abraham James Domingo — BS Computer Science and University Scholar</title>
  <desc id="heroDesc">Dark neon profile banner with animated glow, grid, orbit, and gradient typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#071120"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="nameGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a5b4fc"/>
      <animate attributeName="x1" values="-0.35;0.15;-0.35" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.65;1.15;0.65" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="0.65" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
      <animate attributeName="x1" values="-0.4;0.1;-0.4" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.6;1.1;0.6" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.55"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="lineGlow" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="cardClip">
      <rect width="1200" height="340" rx="24"/>
    </clipPath>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#vignette)"/>

    <circle cx="1000" cy="30" r="170" fill="#0ea5e9" opacity="0.22" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.14;0.26;0.14" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1110" cy="320" r="150" fill="#7c3aed" opacity="0.16" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.10;0.20;0.10" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="330" r="130" fill="#22d3ee" opacity="0.12" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.08;0.16;0.08" dur="13s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.18">
      <circle cx="1020" cy="200" r="112" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 10">
        <animateTransform attributeName="transform" type="rotate" from="0 1020 200" to="360 1020 200" dur="40s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="88" r="3.5" fill="#22d3ee">
        <animateTransform attributeName="transform" type="rotate" from="0 1020 200" to="360 1020 200" dur="40s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0.14" stroke="#22d3ee" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1044 148 L1014 180 L1044 212"/>
      <path d="M1146 148 L1176 180 L1146 212"/>
      <path d="M1120 138 L1070 222"/>
    </g>

    <g>
      <rect x="888" y="52" width="240" height="38" rx="19" fill="#0b1220" stroke="#1e293b"/>
      <circle cx="910" cy="71" r="4.5" fill="#34d399">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="910" cy="71" r="7" fill="none" stroke="#34d399" stroke-width="1" opacity="0.4">
        <animate attributeName="r" values="4.5;9;4.5" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="928" y="76" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#cbd5e1" letter-spacing="0.4">Open to opportunities</text>
    </g>

    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="72" y="82" fill="#22d3ee" font-size="13" font-weight="600" letter-spacing="4.5">HELLO, WORLD</text>
      <rect x="72" y="96" width="46" height="2" rx="1" fill="#22d3ee" opacity="0.9">
        <animate attributeName="width" values="46;92;46" dur="6s" repeatCount="indefinite"/>
      </rect>

      <text x="70" y="176" font-size="56" font-weight="700" letter-spacing="-1" fill="url(#nameGradient)">Abraham James Domingo</text>

      <text x="72" y="220" font-size="20" font-weight="400" fill="#cbd5e1">BS Computer Science <tspan fill="#22d3ee">·</tspan> University Scholar</text>
      <text x="72" y="252" font-size="16.5" fill="#7c8ba1">Isabela State University <tspan fill="#475569">·</tspan> Sophomore</text>

      <rect x="72" y="288" width="1056" height="2" rx="1" fill="url(#underline)" opacity="0.8"/>
      <rect x="72" y="286" width="1056" height="5" rx="2.5" fill="url(#underline)" opacity="0.35" filter="url(#lineGlow)"/>
    </g>

    <g fill="#22d3ee">
      <circle cx="836" cy="236" r="2.5">
        <animate attributeName="cy" values="236;224;236" dur="5.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;0.9;0.25" dur="5.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="956" cy="286" r="2">
        <animate attributeName="cy" values="286;272;286" dur="6.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1160" cy="238" r="2.5" fill="#818cf8">
        <animate attributeName="cy" values="238;226;238" dur="7.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="7.2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="23.5" fill="none" stroke="#1e293b" stroke-width="1"/>
</svg>
