<svg xmlns="http://www.w3.org/2000/svg" width="540" height="340" viewBox="0 0 540 340" role="img" aria-labelledby="termTitle">
  <title id="termTitle">Terminal window with Abraham's academic profile</title>
  <defs>
    <linearGradient id="tborder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#818cf8"/>
      <animate attributeName="x1" values="0;0.2;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="tbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="tglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="tclip"><rect x="10" y="10" width="520" height="320" rx="18"/></clipPath>
  </defs>

  <rect x="10" y="10" width="520" height="320" rx="18" fill="#020617" stroke="#22d3ee" stroke-width="1.5" opacity="0.18" filter="url(#tglow)"/>
  <g clip-path="url(#tclip)">
    <rect x="10" y="10" width="520" height="320" fill="#0b1220"/>
    <rect x="10" y="10" width="520" height="44" fill="url(#tbar)"/>
    <line x1="10" y1="54" x2="530" y2="54" stroke="#1e293b"/>
    <circle cx="36" cy="32" r="5" fill="#ff5f57"/>
    <circle cx="54" cy="32" r="5" fill="#febc2e"/>
    <circle cx="72" cy="32" r="5" fill="#28c840"/>
    <text x="270" y="36" text-anchor="middle" font-family="'Cascadia Code', Consolas, monospace" font-size="10.5" fill="#64748b">abraham@isu: ~</text>

    <rect x="10" y="54" width="3" height="276" fill="url(#tborder)" opacity="0.6"/>

    <rect x="14" y="54" width="512" height="2" fill="#22d3ee" opacity="0.05">
      <animate attributeName="y" values="58;326;58" dur="8s" repeatCount="indefinite"/>
    </rect>

    <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="15">
      <text x="32" y="88" fill="#e2e8f0"><tspan fill="#22d3ee">❯</tspan> whoami</text>
      <text x="32" y="113" fill="#94a3b8">Abraham James Domingo</text>
      <text x="32" y="144" fill="#e2e8f0"><tspan fill="#22d3ee">❯</tspan> cat academic.json</text>
      <text x="32" y="172" fill="#64748b">{</text>
      <text x="48" y="196"><tspan fill="#7dd3fc">"degree"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#fbbf24">"BS Computer Science"</tspan><tspan fill="#64748b">,</tspan></text>
      <text x="48" y="220"><tspan fill="#7dd3fc">"year"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#fbbf24">"Sophomore"</tspan><tspan fill="#64748b">,</tspan></text>
      <text x="48" y="244"><tspan fill="#7dd3fc">"honor"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#fbbf24">"University Scholar"</tspan><tspan fill="#64748b">,</tspan></text>
      <text x="48" y="268"><tspan fill="#7dd3fc">"university"</tspan><tspan fill="#64748b">: </tspan><tspan fill="#fbbf24">"Isabela State University"</tspan></text>
      <text x="32" y="292" fill="#64748b">}</text>
      <text x="32" y="324" fill="#22d3ee">❯</text>
      <rect x="48" y="309" width="8" height="18" rx="1.5" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
